<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Crisis</title>
<style>
body{font-family:Arial;text-align:center;background:#111;color:white;padding:40px}
h1{color:#ff5c5c}
button{background:#ff5c5c;color:white;border:none;padding:15px 25px;border-radius:10px;font-size:18px}
</style>
</head>
<body>
<h1>Proyecto Crisis</h1>
<p>Si estás pasando un mal momento, no estás sola.</p>
<p>Respirá, pedí ayuda, hablá con alguien de confianza.</p>
<button onclick="alert('Respirá profundo. Todo va a estar bien.')">Necesito ayuda</button>
</body>
<div style="text-align:center; padding:20px; background:#FFF0F5; border-radius:20px; margin:20px;">
<h2>Respira conmigo</h2>
<p id="texto">Toca empezar y segui el circulo</p>
<div id="circulo" style="width:120px; height:120px; background:#FFB6C1; border-radius:50%; margin:20px auto; display:flex; align-items:center; justify-content:center; font-size:20px;">💛</div>
<button onclick="respirar()">Empezar</button>
</div>

<script>
function respirar(){
let c = document.getElementById('circulo');
let t = document.getElementById('texto');
t.innerText = "Inhala... 4 segundos";
c.style.width = "180px"; c.style.height = "180px";
setTimeout(()=>{ t.innerText = "Mantene... 4 segundos"; }, 4000);
setTimeout(()=>{ t.innerText = "Exhala... 4 segundos"; c.style.width="120px"; c.style.height="120px"; }, 8000);
setTimeout(()=>{ t.innerText = "Muy bien! Otra vez?"; }, 12000);
}
</script>
</body>
</html>
